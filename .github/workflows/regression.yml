name: Selenium Regression Suite

on:
  push:
    branches: [ "develop" ] # Runs every time you push code
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  build-and-test:
    runs-on: ubuntu-latest # High-performance Linux environment

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Setup Chrome for Testing
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Run Selenium Tests
      run: mvn clean test -DsuiteXmlFile=testng.xml
      
    - name: Upload Test Report
      if: always() # Runs even if tests fail
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports/ # Or your ExtentReports path